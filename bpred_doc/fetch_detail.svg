<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" font-family="'DejaVu Sans', 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BTB and BHT in the IFU fetch datapath</title>
  <desc id="d">Detail of how the early BTB and the fetch-side BHT port are wired into the IFU fetch address path and steer the next fetch without flushing the queue.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#243740"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#b9791b"/></marker>
  </defs>
  <rect x="0" y="0" width="1060" height="580" fill="#ffffff"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#243740">Деталь 1 - куда встроены BTB и BHT в тракт выборки IFU</text>
  <text x="33" y="59" font-size="12.5" fill="#5a6b73">ранний steer меняет только адрес следующей выборки; очередь не флашится</text>

  <!-- fetch reg -->
  <rect x="48" y="236" width="152" height="70" rx="7" fill="#cfe8f6" stroke="#243740" stroke-width="1.5"/>
  <text x="124" y="266" text-anchor="middle" font-size="13.5" font-weight="700" fill="#243740">Fetch-регистр</text>
  <text x="124" y="285" text-anchor="middle" font-size="11" fill="#40525b" font-family="monospace">imem_addr_ff</text>
  <!-- memory -->
  <rect x="48" y="392" width="152" height="60" rx="7" fill="#b0e3e6" stroke="#243740" stroke-width="1.5"/>
  <text x="124" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#243740">IMEM / TCM</text>
  <line x1="124" y1="306" x2="124" y2="388" stroke="#243740" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="132" y="352" font-size="10.5" fill="#40525b">запрос слова</text>

  <!-- BTB -->
  <rect x="248" y="150" width="200" height="128" rx="8" fill="#ffe1b0" stroke="#b9791b" stroke-width="1.6"/>
  <text x="348" y="174" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a4d10">BTB</text>
  <text x="348" y="192" text-anchor="middle" font-size="10.8" fill="#7a4d10">чтение по адресу слова</text>
  <line x1="262" y1="204" x2="434" y2="204" stroke="#e6c079"/>
  <text x="348" y="222" text-anchor="middle" font-size="10.5" fill="#7a4d10">выдаёт: hit · target · safe</text>
  <text x="348" y="238" text-anchor="middle" font-size="10.5" fill="#7a4d10">is_cond · bht_index</text>
  <text x="348" y="262" text-anchor="middle" font-size="9.5" fill="#9a7030" font-family="monospace">scr1_pipe_btb.sv</text>
  <line x1="200" y1="258" x2="246" y2="222" stroke="#b9791b" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="214" y="248" font-size="10" fill="#8a5f22">адрес слова</text>

  <!-- BHT fetch port -->
  <rect x="248" y="304" width="200" height="80" rx="8" fill="#ffe1b0" stroke="#b9791b" stroke-width="1.6"/>
  <text x="348" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a4d10">BHT - fetch-порт</text>
  <text x="348" y="347" text-anchor="middle" font-size="10.3" fill="#7a4d10">индекс = bht_index из BTB</text>
  <text x="348" y="365" text-anchor="middle" font-size="10.3" fill="#7a4d10">обучен? · взят?</text>
  <line x1="348" y1="278" x2="348" y2="302" stroke="#b9791b" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="354" y="296" font-size="9.5" fill="#8a5f22">bht_index</text>

  <!-- gate -->
  <rect x="496" y="198" width="216" height="120" rx="8" fill="#fff2dd" stroke="#b9791b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="604" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#b9791b">Условие раннего steer</text>
  <text x="604" y="247" text-anchor="middle" font-size="11" fill="#7a4d10">рулить, если hit &amp; safe и:</text>
  <text x="604" y="267" text-anchor="middle" font-size="11" fill="#7a4d10">безусловный jump - всегда,</text>
  <text x="604" y="286" text-anchor="middle" font-size="11" fill="#7a4d10">условная ветка - только</text>
  <text x="604" y="305" text-anchor="middle" font-size="11" fill="#7a4d10">если BHT: обучен-и-взят</text>
  <line x1="448" y1="228" x2="494" y2="236" stroke="#b9791b" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="470" y="220" text-anchor="middle" font-size="9" fill="#8a5f22">hit/safe/is_cond</text>
  <line x1="448" y1="330" x2="494" y2="290" stroke="#b9791b" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="470" y="342" text-anchor="middle" font-size="9" fill="#8a5f22">обучен/взят</text>

  <!-- mux next addr -->
  <rect x="760" y="196" width="220" height="124" rx="8" fill="#cfe8f6" stroke="#243740" stroke-width="1.6"/>
  <text x="870" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#243740">Выбор след. адреса</text>
  <text x="870" y="239" text-anchor="middle" font-size="10" fill="#40525b" font-family="monospace">imem_addr_next</text>
  <text x="772" y="264" font-size="10.6" fill="#b9791b">• цель BTB (steer)</text>
  <text x="772" y="284" font-size="10.6" fill="#243740">• редирект EXU - приоритет</text>
  <text x="772" y="304" font-size="10.6" fill="#40525b">• последовательный (+слово)</text>
  <line x1="712" y1="256" x2="758" y2="256" stroke="#b9791b" stroke-width="1.7" marker-end="url(#aa)"/>
  <text x="735" y="249" text-anchor="middle" font-size="9.5" fill="#8a5f22">steer + цель</text>

  <!-- feedback to fetch reg -->
  <path d="M870,196 L870,120 L124,120 L124,234" fill="none" stroke="#243740" stroke-width="1.7" marker-end="url(#a)"/>
  <text x="497" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#243740">адрес следующей выборки - в Fetch-регистр (следующий такт)</text>

  <!-- steer FIFO + queue -->
  <rect x="496" y="392" width="484" height="94" rx="8" fill="#fff2dd" stroke="#b9791b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="738" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#b9791b">Пометка слова перехода в очереди</text>
  <text x="738" y="439" text-anchor="middle" font-size="10.6" fill="#7a4d10">флаг steer едет по короткому FIFO (запрос выборки - ответ памяти)</text>
  <text x="738" y="457" text-anchor="middle" font-size="10.6" fill="#7a4d10">и метит слово перехода: его цель встаёт следующей записью, без флаша очереди</text>
  <text x="738" y="475" text-anchor="middle" font-size="10.6" fill="#7a4d10">на голове очереди флаг подтверждает steer (commit) или откатывает (misfetch)</text>
  <line x1="604" y1="318" x2="604" y2="390" stroke="#b9791b" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="610" y="356" font-size="9.5" fill="#8a5f22">флаг steer</text>
</svg>
